
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIK339 - Labb 1</title>

    <!-- Kopplar JavaScript-filen till HTML -->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>GIK339 - Labb 1</h1>
    <p>JavaScript intro, variabler och funktioner.</p>
</body>
</html>

<!--
Reflektion uppgift 1:

Placeringen av script-taggen påverkar när JavaScript körs.
Om script-taggen ligger i head utan defer kan JavaScript
köras innan HTML-dokumentet har laddats klart.

Attributet defer gör att JavaScript-filen laddas samtidigt
som HTML-dokumentet, men körs först när HTML har parsats klart.
Det gör att HTML-elementen hinner skapas innan JavaScript körs.
-->
